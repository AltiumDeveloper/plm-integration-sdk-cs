<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1431" height="404" viewBox="0 0 1431 404" font-family="Helvetica, Arial, &apos;Liberation Sans&apos;, sans-serif">
  <title>Altium 365 connecting to a PLM system through a Custom Connector</title>
  <defs>
    <marker id="arrow" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#3a414a"/>
    </marker>
  </defs>

  <rect width="1431" height="404" fill="#ffffff"/>

  <!-- Altium 365 -->
  <image x="105" y="175" width="97" height="109" xlink:href="data:image/png;base64,"/>
  <text x="153.5" y="322" font-size="22" fill="#4a5059" text-anchor="middle">Altium 365</text>

  <!-- Altium 365 to Custom Connector -->
  <line x1="203" y1="230" x2="625" y2="230" stroke="#3a414a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="414" y="218" font-size="17" font-weight="bold" fill="#3a414a" text-anchor="middle">gRPC with SSL/TLS</text>
  <text x="414" y="248" font-size="17" font-weight="bold" fill="#3a414a" text-anchor="middle">443</text>

  <!-- Custom PLM integrations -->
  <rect x="582" y="67" width="780" height="281" rx="6" fill="none" stroke="#3a414a" stroke-width="1.5"/>
  <text x="972" y="100" font-size="21" font-weight="bold" fill="#3a414a" text-anchor="middle">Custom PLM integrations (SaaS model, publicly available)</text>

  <rect x="626" y="176" width="172" height="107" rx="4" fill="#cfe2ff" stroke="#3a414a" stroke-width="1.5"/>
  <text x="712" y="221" font-size="22" font-weight="bold" fill="#3a414a" text-anchor="middle">Custom</text>
  <text x="712" y="250" font-size="22" font-weight="bold" fill="#3a414a" text-anchor="middle">Connector</text>

  <line x1="798" y1="230" x2="1144" y2="230" stroke="#3a414a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1145" y="176" width="174" height="107" rx="4" fill="#ffffff" stroke="#3a414a" stroke-width="1.5"/>
  <text x="1232" y="237" font-size="22" fill="#4a5059" text-anchor="middle">PLM system</text>
</svg>
